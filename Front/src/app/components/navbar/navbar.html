<header class="fixed top-0 left-0 right-0 z-50 bg-fondo border-b border-tinta/10">
    <div class="max-w-7xl mx-auto px-4 md:px-8 h-16 flex items-center justify-between">
        <!-- Logo -->

        <a routerLink="/" class="flex items-center gap-3">
            <div class="w-14 h-10 rounded-full bg-fondo/95 flex items-center justify-center">
                <img src="assets/images/general/favicon.webp" alt="">
            </div>

            <div>
                <span class="text-tinta tracking-wider text-sm" style="font-family: 'Playfair Display', serif">
                    Los Trigales
                </span>

                <span class="text-tinta-suave text-xs block leading-none tracking-widest uppercase">
                    Una Pasta Diferente
                </span>
            </div>
        </a>

        <!-- Desktop Nav -->

        <nav class="hidden md:flex items-center gap-8">
            @for(link of navLinks; track link.to) {

            <a [routerLink]="link.to" class="text-sm uppercase tracking-wider transition-colors duration-200" [ngClass]="{
          'text-acento': isActive(link.to),
          'text-tinta-suave hover:text-tinta': !isActive(link.to)
        }">
                {{ link.label }}
            </a>

            }
        </nav>

        <!-- Actions -->

        <div class="flex items-center gap-3">
            <!-- <button (click)="openCart()"
                class="relative p-2 text-tinta-suave hover:text-acento transition-colors duration-200">
                🛒

                @if(cartCount > 0) {
                <span
                    class="absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-[#b5451b] text-[#fff8ef] text-[10px] flex items-center justify-center font-medium">
                    {{ cartCount }}
                </span>
                }
            </button> -->

            <!-- @if(isLoggedIn) {

            <div class="hidden md:flex items-center gap-2">
                <span class="text-tinta-suave text-sm">
                    {{ user.name.split(' ')[0] }}
                </span>

                <button (click)="logout()" class="p-2 text-tinta-suave hover:text-acento transition-colors">
                    🚪
                </button>
            </div>

            } @else {

            <button (click)="openLogin()"
                class="hidden md:flex items-center gap-2 px-4 py-1.5 border border-acento/50 text-acento text-sm uppercase tracking-wider hover:bg-[#b5451b]/8 transition-colors duration-200 rounded-sm">
                👤
                Ingresar
            </button>

            } -->

            <button type="button" (click)="toggleTheme()"
                class="p-2 flex items-center text-tinta-suave hover:text-acento transition-colors duration-200 cursor-pointer"
                [attr.aria-label]="darkMode ? 'Activar modo claro' : 'Activar modo oscuro'"
                [title]="darkMode ? 'Modo claro' : 'Modo oscuro'">
                <span class="material-icons text-xl">{{ darkMode ? 'light_mode' : 'dark_mode' }}</span>
            </button>

            <button class="md:hidden p-2 text-tinta-suave hover:text-tinta" (click)="toggleMobile()">
                {{ mobileOpen ? '✕' : '☰' }}
            </button>
        </div>
    </div>

    <!-- Mobile Menu -->

    @if(mobileOpen) {

    <div class="md:hidden bg-fondo border-t border-tinta/10 overflow-hidden">
        <div class="px-4 py-4 flex flex-col gap-4">
            @for(link of navLinks; track link.to) {

            <a [routerLink]="link.to" (click)="closeMobile()" class="text-sm uppercase tracking-wider py-1" [ngClass]="{
          'text-acento': isActive(link.to),
          'text-tinta-suave': !isActive(link.to)
        }">
                {{ link.label }}
            </a>

            }

            <!-- @if(isLoggedIn) {

            <button (click)="logout(); closeMobile()"
                class="text-left text-sm text-tinta-suave uppercase tracking-wider py-1">
                Cerrar sesión ({{ user.name }})
            </button>

            } @else {

            <button (click)="openLogin(); closeMobile()"
                class="text-left text-sm text-acento uppercase tracking-wider py-1">
                Ingresar
            </button>

            } -->
        </div>
    </div>

    }
</header>
