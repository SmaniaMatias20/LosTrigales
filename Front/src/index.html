<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="any">

  <link rel="apple-touch-icon" href="assets/images/general/apple-touch-icon.png">
  <script>
    // Aplica el tema guardado antes de que cargue Angular para evitar parpadeos
    try {
      var tema = localStorage.getItem('tema');
      if (tema === 'oscuro' || (!tema && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) { }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
